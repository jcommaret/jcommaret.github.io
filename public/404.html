<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirection - Jérôme Commaret</title>
    <script>
      // GitHub Pages SPA redirect for HashRouter
      // This script will redirect 404 errors back to the index page
      // which will then handle the routing with HashRouter
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
  </head>
  <body>
    <p>Redirection en cours...</p>
  </body>
</html>
